[project]
name = "webagent"
version = "0.1.0"
description = "云端多模态AI浏览器智能PRA"
requires-python = ">=3.10"
authors = [{ name = "neonsaya" }]
license = { text = "Proprietary" }
readme = { content-type = "text/markdown", text = "WebAgent 商用桌面端" }

# ---------------- 生产依赖（运行时必装） ----------------
dependencies = [
    # 浏览器引擎 & 反检测
    "playwright>=1.47.0",
    "playwright-stealth>=1.0.6",

    # 桌面窗口控制
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pillow>=10.4.0",

    # AI 决策 & 多模态客户端（OpenAI 兼容协议）
    "openai>=1.40.0",
    "transitions>=0.9.2",

    # HTTP API 层（前端通信）
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "websockets>=12.0",

    # 桌面窗口壳（EXE 内嵌 WebView）
    "pywebview>=5.1",

    # 工程基础
    "loguru>=0.7.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.32",
    "tenacity>=8.5.0",
]

# ---------------- 开发依赖（不打入 EXE） ----------------
[dependency-groups]
dev = [
    "pyinstaller>=6.10.0",
    "ruff>=0.6.4",
    "pytest>=8.3.2",
]

# ---------------- UV 配置 ----------------
# 关闭包安装：避免在 Windows 中文路径下生成带中文绝对路径的 .pth 文件
[tool.uv]
package = false

# ---------------- Ruff 风格 ----------------
[tool.ruff]
line-length = 110
target-version = "py310"

# 清华源
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
